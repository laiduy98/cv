name: Build CV

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history + tags for git describe
      # Minimal TeX Live (only what awesome-cv needs), cached between runs
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: >-
            scheme-infraonly latex-bin xetex latexmk fontname
            amsmath enumitem environ etoolbox fancyhdr fontawesome fontspec
            geometry graphics graphics-cfg graphics-def hycolor hyperref
            ifmtarg kvoptions kvsetkeys l3backend l3kernel l3packages
            lm-math parskip pgf ragged2e refcount rerunfilecheck setspace
            sourcesanspro tcolorbox tikzfill tools trimspaces unicode-math
            url xcolor xifthen xkeyval
            bigintcalc bitset gettitlestring iftex infwarerr intcalc
            kvdefinekeys ltxcmds pdfescape pdftexcmds stringenc uniquecounter
      - run: |
          # fontawesome.sty loads "FontAwesome" by name, so fontconfig must see it
          mkdir -p ~/.fonts && cp "$(kpsewhich FontAwesome.otf)" ~/.fonts/ && fc-cache -f
          for l in fr en vn; do latexmk -xelatex -interaction=nonstopmode -halt-on-error resume-$l.tex; done
      - run: |
          mkdir site
          for l in fr en vn; do cp resume-$l.pdf site/$l.pdf; done
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Khang Duy Lai - CV</title>
          <h1>Khang Duy Lai - CV</h1>
          <ul>
            <li><a href="fr.pdf">Français</a></li>
            <li><a href="en.pdf">English</a></li>
            <li><a href="vn.pdf">Tiếng Việt</a></li>
          </ul>
          HTML

      # Release: `tip` (pre-release from main, files named like v5.0-3-gabcdef1)
      # or `vX.Y` (git tag v5.0 && git push origin v5.0)
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || git describe --tags --exclude tip --always)
          mkdir dist
          for l in fr en vn; do cp site/$l.pdf dist/Khang-Duy-Lai-CV-${l^^}-$ver.pdf; done
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            gh release delete tip --cleanup-tag --yes || true
            gh release create tip dist/*.pdf --prerelease --target "$GITHUB_SHA" \
              --title "tip" --notes "Latest build of main (${GITHUB_SHA::7})."
          else
            gh release create "$ver" dist/*.pdf --title "$ver" --generate-notes
          fi

      - uses: actions/upload-artifact@v5  # TEMP: ci-speed test only
        with:
          name: pdfs
          path: site/*.pdf

      # Pages always shows the latest versioned release
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
